services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-regalino}
      POSTGRES_USER: ${POSTGRES_USER:-regalino}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-regalino}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-regalino} -d ${POSTGRES_DB:-regalino}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    ports:
      - "8020:8000"
    environment:
      SCRAPER_URL: http://scraper:8000
    # Anche sulla rete dello scraper, che invece non vede db e redis.
    networks: [default, scraper]
    # Risponde solo dopo migrate: worker e beat aspettano questo, non il
    # semplice avvio del container (beat crasha se le sue tabelle mancano).
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8000/admin/login/"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  worker:
    build:
      context: ./backend
    env_file: .env
    depends_on:
      backend:
        condition: service_healthy
    command: celery -A config worker -l info

  beat:
    build:
      context: ./backend
    env_file: .env
    depends_on:
      backend:
        condition: service_healthy
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler

  # Browser headless che apre le pagine dei negozi (ADR 0005). Sta da solo su
  # una rete sua: dalla pagina di un sito non si arriva a db, redis o backend admin.
  scraper:
    build:
      context: ./scraper
    networks: [scraper]
    environment:
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
    # Come in produzione (deploy/compose.prod.yaml): senza capability, in sola
    # lettura e col profilo seccomp che lascia partire la sandbox di Chromium.
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
      - seccomp=./deploy/seccomp-chromium.json

  frontend:
    build:
      context: ./frontend
    env_file: .env
    depends_on:
      - backend
    ports:
      - "5176:5176"

networks:
  scraper:

volumes:
  pgdata:
